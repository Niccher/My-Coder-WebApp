# Standalone Docker Compose for My Coder WebApp
# Usage: docker compose up --build -d
# This will spin up the webapp, MySQL, and Dozzle log viewer.

services:
  mysql:
    image: mysql:8.4
    container_name: shared-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db_my_coder
    command: --sql-mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot_password && mysql -h 127.0.0.1 -u root -proot_password -e 'SELECT 1;' db_my_coder >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - shared-network

  dozzle:
    image: amir20/dozzle:latest
    container_name: shared-dozzle
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - shared-network

  my-coder:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-coder-webapp:latest
    container_name: my-coder-webapp
    ports:
      - "80:80"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root_password
      - DB_DATABASE=db_my_coder
      - database.default.hostname=mysql
      - database.default.database=db_my_coder
      - database.default.username=root
      - database.default.password=root_password
      - database.default.port=3306
      - database.default.DBDriver=MySQLi
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shared-network

volumes:
  mysql-data:

networks:
  shared-network:
    name: hosts-shared-network

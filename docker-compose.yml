# Standalone Docker Compose for My Coder WebApp
# Usage: docker compose up --build -d
# This will spin up the webapp, MySQL, and Dozzle log viewer.

services:
  mysql:
    image: mysql:8.4
    container_name: shared-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: db_my_coder
    command: --sql-mode="STRICT_TRANS_TABLES,NO_ZERO_IN_DATE,NO_ZERO_DATE,ERROR_FOR_DIVISION_BY_ZERO,NO_ENGINE_SUBSTITUTION"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - shared-network

  dozzle:
    image: amir20/dozzle:latest
    container_name: shared-dozzle
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - shared-network

  my-coder:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-coder-webapp:latest
    container_name: my-coder-webapp
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shared-network

volumes:
  mysql-data:

networks:
  shared-network:
    name: hosts-shared-network
